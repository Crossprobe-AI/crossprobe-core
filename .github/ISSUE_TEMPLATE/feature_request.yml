name: Feature request
description: A KiCad feature the editor lacks, or something new.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: For a KiCad feature, its name and menu, and what it does in KiCad. The parity table in the README says what is there already.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it is for
      description: The work it would make possible or easier.
